[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-capacity-service-demand-optimisation"
version = "1.0.0"
description = "Workforce capacity planning and service-demand optimisation platform for a multi-region field and community services organisation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "duckdb>=1.1",
    "pyyaml>=6",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
