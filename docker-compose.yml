services:
  pipeline:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m python.run_pipeline --stage all"
    environment:
      PROJECT_ENV: local
      RANDOM_SEED: "42"
      WFCSO_DEV_MODE: "true"
